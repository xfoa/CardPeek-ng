[workspace]
members = [
    "crates/cardpeek-core",
    "crates/cardpeek-transport",
    "crates/cardpeek-pcsc",
    "crates/cardpeek-replay",
    "crates/cardpeek-analyser",
    "crates/cardpeek-lua",
    "crates/cardpeek-app",
    "crates/cardpeek-cli",
    "crates/cardpeek-desktop",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
clap = { version = "4.5.51", features = ["derive"] }
directories = "6.0.0"
dioxus = { version = "0.7.3", features = ["native"] }
mlua = { version = "0.11.4", features = ["lua54", "vendored", "serialize"] }
pcsc = "2.9.0"
rfd = { version = "0.15.4", default-features = false, features = ["gtk3"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.48.0", features = ["time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = "debuginfo"
lto = "thin"
