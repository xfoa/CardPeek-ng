[workspace]
members = [
    "crates/cardpeek-core",
    "crates/cardpeek-transport",
    "crates/cardpeek-pcsc",
    "crates/cardpeek-replay",
    "crates/cardpeek-analyzer",
    "crates/cardpeek-lua",
    "crates/cardpeek-app",
    "crates/cardpeek-cli",
    "crates/cardpeek-desktop",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
strip = "debuginfo"
lto = "thin"
